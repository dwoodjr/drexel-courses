	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

# Practice Immanent Critique

<span style="font-size:0.85em; color:#e8e0d4;">Research-creation as methodology. What does it mean to think *with* tools rather than *through* them?</span>

<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#d4a844;">DIGM 553/753 — Experimental Digital Media Lab · Darren Woodland Jr.</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="display:flex; align-items:center; justify-content:center; height:70vh;">
<div style="text-align:center;">

<p style="font-size:1.4em; font-style:italic; color:#e8e0d4; line-height:1.55; max-width:80%; margin:0 auto;">"What is your practice thinking right now?"</p>

<p style="font-family:'Courier New',monospace; font-size:0.7em; color:#d4a844; margin-top:2em;">— not what are you making. what is the act of making <em>already</em> thinking?</p>

</div>
</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

> "Every practice is a mode of thought, already in the act. To dance: a thinking in movement. To paint: a thinking through color. To perceive in the everyday: a thinking of the world's varied ways of affording itself."
>
> — Manning & Massumi, *Thought in the Act*

To program — a thinking in what?
To route audio signals — a thinking in what?
To touch a capacitive sensor — a thinking in what?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.65em; letter-spacing:0.1em; color:#ffb300;">W01A</span>

# Research-Creation
as Method

<span style="font-size:0.82em; color:#d4a844; font-style:italic;">"Making would already be thinking-in-action, and conceptualization a practice in its own right."</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01A — The Problem</span>

# The Prebifurcation Point

Most institutional models treat research and creative practice as *sequential* and *separate*: research produces knowledge, practice illustrates it.

**Research-creation** is an attempt to name the activity that happens before this split. Where making and thinking are not distinct acts but two registers of the same act, happening simultaneously.

> Manning & Massumi: activity at the **prebifurcation point** — before research and creation diverge into institutional structures that evaluate them by separate criteria.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01A — Immanent Critique</span>

# Inhabiting Complicity

> "An immanent critique engages with new processes more than new products… The strategy of immanent critique is to inhabit one's complicity and make it turn — in the sense in which butter 'turns' to curd."
>
> — Manning & Massumi

We work *within* the university, with commercial tools, toward grades. That is our complicity. Immanent critique means making that complicity productive. We do not wait until we're free of it to begin practice.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01A — Three Distinctions</span>

# Distinctions to Internalize

<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.8em; margin-top:0.8em;">

<div style="border-top:2px solid #ffb300; padding:0.9em; background:rgba(255,255,255,0.03);">
<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#d4a844;">01</span>

**Process, not Product**

"An interpenetration of processes rather than a communication of products." The artifact is the *record* of practice, not the point of it.
</div>

<div style="border-top:2px solid #ffb300; padding:0.9em; background:rgba(255,255,255,0.03);">
<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#d4a844;">02</span>

**Conditioning, not Framing**

Framing sets rules. Conditioning brings co-causes into interaction so that something *emerges* that neither cause alone could produce.
</div>

<div style="border-top:2px solid #ffb300; padding:0.9em; background:rgba(255,255,255,0.03);">
<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#d4a844;">03</span>

**Enabling Constraints**

A limitation that, through interaction, generates emergence rather than restriction. Gravity enables the jump.
</div>

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01A — Enabling Constraints</span>

# The Productive Limit

> "In our experience, unconstrained interaction rarely yields worthwhile effects."
>
> — Manning & Massumi

The MPR121 sensor constrains what counts as input. CircuitPython constrains what you can compute. OSC constrains the format of the data.

These are **the material conditions from which something emerges**. We do not aim to eliminate constraints, but turn them from limitative to enabling.

- What in your practice functions as *gravity* — the resistance you push against?
- What would your work look like if that constraint were removed?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.65em; letter-spacing:0.1em; color:#ffb300;">W01B</span>

# Epistemic Tools
Introduction

<span style="font-size:0.82em; color:#d4a844; font-style:italic;">"Instruments have a life of their own. They do not merely follow theory; often they determine theory, because instruments determine what is possible, and what is possible determines to a large extent what can be thought."</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Core Claim</span>

# Tools Are Not Neutral

If making is already a mode of thinking, then the instrument you make *with* is already shaping the kinds of thought that are possible.

Choosing TouchDesigner over Processing, Max/MSP over SuperCollider, a capacitive sensor over a camera. 
These are **epistemological** decisions just as much as practical or technical.

The choice of instrument is never neutral. It conditions what questions you can ask, what results you can produce, and — eventually — what you consider beautiful, interesting, or true.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Don Ihde</span>

# How Instruments Relate to the World

<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.8em; margin-top:0.8em;">

<div style="border:1px solid rgba(255,255,255,0.07); padding:0.9em;">
<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#ffb300;">01</span>

**Embodiment Relations**

You act *through* the instrument. It recedes. You experience the world, not the tool. (The practiced musician and the keys.)
</div>

<div style="border:1px solid rgba(255,255,255,0.07); padding:0.9em;">
<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#ffb300;">02</span>

**Hermeneutic Relations**

The instrument produces data you must *interpret*. A spectrograph, a sensor reading, a heat map. The tool mediates by translating.
</div>

<div style="border:1px solid rgba(255,255,255,0.07); padding:0.9em;">
<span style="font-family:'Courier New',monospace; font-size:0.6em; color:#ffb300;">03</span>

**Alterity Relations**

The instrument becomes a “quasi-other”. You engage *with* it, not through it. Generative systems, interactive installations.
</div>

</div>

<span style="font-size:0.7em; color:#d4a844;">These modalities are tendencies, not fixed categories. Any practice oscillates between them.</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Ihde</span>

# Amplification-Reduction

Every instrument amplifies certain features of the world and reduces others. No exception.

| Instrument | Amplifies / Reduces |
|---|---|
| Microphone | Pressure-wave events in a frequency range / everything else |
| MIDI controller | Discrete pitch + velocity events / continuous, gestural sound |
| MPR121 sensor | Conductivity at 12 points / pressure, texture, temperature, gesture |
| Your DAW | Timeline-based regions, channels, automation / ? |

<span style="font-size:0.7em; color:#d4a844;">The danger is not that tools reduce, they must in order to function. The danger is *forgetting* what they reduce.</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Latour / Bowker & Star</span>

# Black Boxes

> "The more naturalized the object becomes, the more unquestioning the relationship of the community to it; the more invisible the contingent and historical circumstances of its birth, the more it sinks into the community's routinely forgotten memory."
>
> — Bowker & Star

The tools you're most fluent with are the most dangerous. **Fluency produces blindness.**

The instrument you've used for years is the instrument whose assumptions you've most thoroughly absorbed into your practice without noticing.

- What's the most black-boxed tool in your practice?
- When did you last open it?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Agre</span>

# Computational Imperialism

> "A computer, then, does not simply have an instrumental use in a given site of practice; the computer is frequently *about* that site in its very design."
>
> — Philip Agre, *Toward a Critical Technical Practice*

Computers, on top of representing activity. also *restructure* it. A DAW (while used for recording and production), fundamentally restructures music-making around timelines, discrete regions, channels, automation curves.

These are models of music built by engineers with particular assumptions about what music *is*.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Agre</span>

# The Split Identity

<div style="display:grid; grid-template-columns:1fr 1fr; gap:1.2em; margin:1em 0;">

<div>

### Craft foot

Fluency. Building. The practiced hand that reaches for the tool without thinking. The expertise that closes black boxes so you can work fast.

</div>

<div>

### Critique foot

Questioning. Opening. The reflexive attention that re-examines assumptions the craft foot has naturalized. The voice that asks *why this tool, why these defaults*.

</div>

</div>

> The split identity never “resolves”. It is the ongoing condition of critical technical practice, not a phase of it.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.65em; letter-spacing:0.1em; color:#ffb300;">W01C — Magnusson</span>

# Hardware & Software
Inventory

<span style="font-size:0.82em; color:#d4a844; font-style:italic;" > "The digital system is material in its body, electric in function, and symbolic in control." — Thor Magnusson</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01C — The Signal Chain</span>

# An Epistemic Inventory

Each arrow is a transformation — an amplification-reduction pair.

<div style="font-family:'Courier New',monospace; font-size:0.72em; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:1.2em 1.6em; line-height:2.2;">

<span style="color:#ffb300;">Body / Material World</span>
<span style="color:#d4a844; padding-left:1.6em;">→ *[touch, vibration, conductance, presence]*</span>

<span style="color:#d4a844; padding-left:1.6em;">→ *[12 threshold events — everything else disappears]*</span>
<span style="color:#ffb300;">QT Py RP2040</span>
<span style="color:#d4a844; padding-left:1.6em;">→ *[CircuitPython — sequential, real-time, no threads]*</span>
<span style="color:#ffb300;">OSC / UDP</span>
<span style="color:#d4a844; padding-left:1.6em;">→ *[named address + typed args — prioritizes latency over reliability]*</span>
<span style="color:#ffb300;">TouchDesigner / Max/MSP</span>
<span style="color:#d4a844; padding-left:1.6em;">→ *[dataflow model — spatial, parallel, visual]*</span>
<span style="color:#ffb300;">Output / Audience</span>

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01C — Agre: Intermediation</span>

# Naming Is a Philosophical Act

When designing your OSC namespace, you have to decide what to *call* your data:

| Option                                    | Problem                                                  |
| ----------------------------------------- | -------------------------------------------------------- |
| `/sensor/capacitive_threshold_event/ch/7` | Too technical: reveals the mechanism, hides the body     |
| `/presence_of_hand/right/index`           | Too phenomenological:  claims more than the sensor knows |
| `/sensor/touch/7`                         | Intermediation: bridges the technical and the lived      |

Your first OSC schema is a philosophical document. What you choose to name your data channels reveals what you think the interaction *is*.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01C — Exercise</span>

# Do Your Epistemic Inventory

Pick one tool you already use in your practice. Any tool. Ask:

- What does this tool **amplify**? What becomes easy, visible, measurable?
- What does this tool **reduce**? What disappears, gets rounded off?
- What world does it **assume exists**? What implicit model of activity, body, or material does its design encode?
- **Who** designed those assumptions, and for what context?

<span style="font-size:0.72em; color:#d4a844;">This exercise is the foundation of ASN 2 — Critical Technical Journal. *It begins this week.*</span>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">W01B — Hold These</span>

# Three Questions
to Carry

- **What does your tool amplify?** What becomes easy, visible, measurable?
- **What does your tool reduce?** What is systematically missing from what it captures?
- **Who designed the reduction?** The defaults in your software were chosen by someone with specific assumptions. What were they?
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#0d0d0d" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1080px; width: 1920px; min-height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<span style="font-family:'Courier New',monospace; font-size:0.58em; color:#ffb300; letter-spacing:0.1em;">Week 01 — Key Terms</span>

# Vocabulary

<div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5em; margin-top:0.6em; font-size:0.75em;">

<div style="background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08); padding:0.55em 0.75em;">
<div style="font-family:'Courier New',monospace; font-size:0.65em; color:#ffb300; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.3em;">Research-Creation <span style="color:#d4a844;">(various)</span></div>
Activity at the prebifurcation point where making and thinking are co-constitutive, not sequential.
</div>

<div style="background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08); padding:0.55em 0.75em;">
<div style="font-family:'Courier New',monospace; font-size:0.65em; color:#ffb300; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.3em;">Immanent Critique <span style="color:#d4a844;">(Manning & Massumi)</span></div>
Inhabiting complicity and making it turn; critique from inside the system, not from outside it.
</div>

<div style="background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08); padding:0.55em 0.75em;">
<div style="font-family:'Courier New',monospace; font-size:0.65em; color:#ffb300; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.3em;">Enabling Constraint <span style="color:#d4a844;">(Manning & Massumi)</span></div>
A limitation that, through interaction with other forces, generates emergence rather than just restriction.
</div>

<div style="background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08); padding:0.55em 0.75em;">
<div style="font-family:'Courier New',monospace; font-size:0.65em; color:#ffb300; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.3em;">Epistemic Tool <span style="color:#d4a844;">(Magnusson)</span></div>
An instrument that is a knowledge-making artifact; tools determine what is possible and thus what can be thought.
</div>

<div style="background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08); padding:0.55em 0.75em;">
<div style="font-family:'Courier New',monospace; font-size:0.65em; color:#ffb300; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.3em;">Amplification-Reduction <span style="color:#d4a844;">(Ihde)</span></div>
Every tool amplifies certain features and reduces others. No tool is neutral.
</div>

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}
