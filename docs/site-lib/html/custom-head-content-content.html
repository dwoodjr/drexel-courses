<script>
/* Canvas SPA fix — forces full page reload when navigating to canvas pages.
   Workaround for webpage-html-export v1.9.2 bug: postLoadInit crashes on
   canvas pages when loaded via SPA navigation (null setAttribute error).
   See: https://github.com/KosmosisDire/obsidian-webpage-export/issues */
document.addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    var href = link.getAttribute('href') || '';
    if (href.indexOf('-canvas.html') !== -1 || href.indexOf('.canvas') !== -1) {
        e.preventDefault();
        e.stopImmediatePropagation();
        window.location.href = link.href;
    }
}, true); /* capture phase — fires before SPA listener */
</script>
<style>
/* ── Published-site overrides: hide desktop-only Obsidian editing UI ── */

/* Editing Toolbar plugin — appears inside canvas-wrapper on canvas pages */
#editingToolbarModalBar,
#editingToolbarPopoverBar,
.editingToolbarDefaultAesthetic { display: none !important; }

/* Canvas-node action icons that appear when hovering/selecting nodes */
.canvas-node-toolbar,
.canvas-node-container .formatting-toolbar,
.canvas-node-container .view-header { display: none !important; }

/* Right sidebar floating action icons (plugin-sourced) */
.canvas-wrapper + .clickable-icon,
.canvas-wrapper ~ .clickable-icon { display: none !important; }

/* Ensure the canvas-wrapper itself receives pointer events for pan/zoom */
.canvas-wrapper {
    pointer-events: auto !important;
    touch-action: none;
}
</style>
